<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | سيرفر نور</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- مكتبة Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; }</style>
</head>
<body class="bg-slate-50">

  <nav class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">نور</div>
        <span class="font-bold text-xl text-indigo-700">سيرفر نور</span>
      </div>
      <a href="index.html" class="text-sm text-slate-600 hover:text-indigo-600">العودة للرئيسية</a>
    </div>
  </nav>

  <div class="max-w-md mx-auto py-12 px-4">
    <div class="card">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">🔐</div>
        <h2 class="text-2xl font-bold text-slate-900">مرحباً بك في سيرفر نور</h2>
        <p class="text-slate-600 mt-2">أنشئ حساباً أو سجّل دخولك لبدء إدارة سيرفرك.</p>
      </div>

      <!-- رسالة حالة supabase -->
      <div id="supabase-status" class="hidden mb-6 p-3 rounded-lg text-sm">
        <div class="flex items-center gap-2">
          <span id="supabase-status-icon">⏳</span>
          <span id="supabase-status-text">جاري تحميل الخدمات...</span>
        </div>
      </div>

      <div class="flex mb-6">
        <button id="tab-login" class="flex-1 py-3 px-4 bg-indigo-600 text-white rounded-t-lg font-bold shadow-lg">تسجيل دخول</button>
        <button id="tab-register" class="flex-1 py-3 px-4 bg-slate-100 text-slate-500 rounded-t-lg font-bold hover:bg-slate-200">إنشاء حساب جديد</button>
      </div>

      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">البريد الإلكتروني</label>
          <input type="email" id="login-email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" placeholder="example@email.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">كلمة المرور</label>
          <input type="password" id="login-password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" placeholder="••••••••">
        </div>
        <button type="submit" id="btn-login-submit" class="w-full btn-primary py-3 font-bold" disabled>تسجيل الدخول</button>
      </form>

      <form id="form-register" class="hidden space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">الاسم الكامل</label>
          <input type="text" id="reg-name" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" placeholder="أحمد محمد">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">البريد الإلكتروني</label>
          <input type="email" id="reg-email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" placeholder="example@email.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">كلمة المرور</label>
          <input type="password" id="reg-password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" placeholder="••••••••">
        </div>
        <div class="flex items-start gap-2">
          <input type="checkbox" id="reg-agree" required class="mt-1 text-indigo-600">
          <label class="text-sm text-slate-600 leading-relaxed">أوافق على <a href="#" class="text-indigo-600 hover:underline">شروط الاستخدام</a> والالتزام بالشريعة الإسلامية.</label>
        </div>
        <button type="submit" id="btn-register-submit" class="w-full btn-primary py-3 font-bold" disabled>إنشاء حساب</button>
      </form>

      <p class="text-center text-sm text-slate-500 mt-6">
        خدمة مجانية بالكامل · ملتزمة بالشريعة الإسلامية · بياناتك في Supabase
      </p>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script>
    let supabase = null;
    let isReady = false;

    const statusBox = document.getElementById('supabase-status');
    const statusIcon = document.getElementById('supabase-status-icon');
    const statusText = document.getElementById('supabase-status-text');
    const btnLogin = document.getElementById('btn-login-submit');
    const btnRegister = document.getElementById('btn-register-submit');

    function setButtonsEnabled(enabled) {
      btnLogin.disabled = !enabled;
      btnRegister.disabled = !enabled;
      btnLogin.classList.toggle('opacity-50', !enabled);
      btnLogin.classList.toggle('cursor-not-allowed', !enabled);
      btnRegister.classList.toggle('opacity-50', !enabled);
      btnRegister.classList.toggle('cursor-not-allowed', !enabled);
    }

    // تحديث حالة supabase
    function updateSupabaseStatus(ready, message) {
      isReady = ready;
      if (ready) {
        statusBox.classList.add('hidden');
        setButtonsEnabled(true);
      } else {
        statusBox.classList.remove('hidden');
        statusIcon.textContent = '⚠️';
        statusText.textContent = message || 'المكتبة غير جاهزة';
        statusBox.className = 'mb-6 p-3 rounded-lg text-sm bg-amber-50 border border-amber-200 text-amber-800';
        setButtonsEnabled(false);
      }
    }

    // انتظار تهيئة supabase
    function waitForSupabase() {
      return new Promise((resolve) => {
        if (typeof getSupabase === 'function') {
          const client = getSupabase();
          if (client) {
            supabase = client;
            updateSupabaseStatus(true, 'تم التحميل بنجاح');
            resolve(client);
            return;
          }
        }
        onSupabaseReady(() => {
          supabase = getSupabase();
          updateSupabaseStatus(true, 'تم التحميل بنجاح');
          resolve(supabase);
        });
        // fallback بعد 10 ثواني
        setTimeout(() => {
          if (!supabase) {
            updateSupabaseStatus(false, 'فشل تحميل مكتبة Supabase. يرجى تحديث الصفحة أو التحقق من اتصالك بالإنترنت.');
            resolve(null);
          }
        }, 10000);
      });
    }

    async function initAuth() {
      await waitForSupabase();

      if (!supabase) return;

      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');

      // التحقق من وجود جلسة موجودة
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        console.error('فحص الجلسة:', err);
      }

      // التبديل بين التبويبات
      tabLogin.addEventListener('click', () => {
        tabLogin.classList.replace('bg-slate-100', 'bg-indigo-600');
        tabLogin.classList.replace('text-slate-500', 'text-white');
        tabLogin.classList.add('shadow-lg');
        tabRegister.classList.replace('bg-indigo-600', 'bg-slate-100');
        tabRegister.classList.replace('text-white', 'text-slate-500');
        tabRegister.classList.remove('shadow-lg');
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
      });

      tabRegister.addEventListener('click', () => {
        tabRegister.classList.replace('bg-slate-100', 'bg-indigo-600');
        tabRegister.classList.replace('text-slate-500', 'text-white');
        tabRegister.classList.add('shadow-lg');
        tabLogin.classList.replace('bg-indigo-600', 'bg-slate-100');
        tabLogin.classList.replace('text-white', 'text-slate-500');
        tabLogin.classList.remove('shadow-lg');
        formRegister.classList.remove('hidden');
        formLogin.classList.add('hidden');
      });

      // تسجيل الدخول عبر Supabase
      formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        btnLogin.textContent = 'جاري الدخول...';
        btnLogin.disabled = true;

        try {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });

          if (error) {
            alert('خطأ: ' + error.message);
            btnLogin.textContent = 'تسجيل الدخول';
            btnLogin.disabled = false;
            return;
          }

          if (data.user) {
            await ensureProfile(data.user);
            alert('تم تسجيل الدخول بنجاح!');
            window.location.href = 'dashboard.html';
          }
        } catch (err) {
          alert('خطأ غير متوقع: ' + err.message);
          btnLogin.textContent = 'تسجيل الدخول';
          btnLogin.disabled = false;
        }
      });

      // إنشاء حساب جديد عبر Supabase
      formRegister.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        btnRegister.textContent = 'جاري إنشاء الحساب...';
        btnRegister.disabled = true;

        try {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: { data: { full_name: name } }
          });

          if (error) {
            alert('خطأ: ' + error.message);
            btnRegister.textContent = 'إنشاء حساب';
            btnRegister.disabled = false;
            return;
          }

          if (data.user) {
            alert('تم إنشاء حسابك بنجاح! يمكنك الآن تسجيل الدخول.');
            tabLogin.click();
          }
        } catch (err) {
          alert('خطأ غير متوقع: ' + err.message);
        } finally {
          btnRegister.textContent = 'إنشاء حساب';
          btnRegister.disabled = false;
        }
      });
    }

    async function ensureProfile(user) {
      try {
        const { data: existing } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', user.id)
          .single();

        if (!existing) {
          await supabase
            .from('profiles')
            .insert({
              id: user.id,
              email: user.email,
              full_name: user.user_metadata?.full_name || '',
              created_at: new Date().toISOString(),
              updated_at: new Date().toISOString()
            });
        }
      } catch (err) {
        console.error('خطأ في إنشاء الملف الشخصي:', err);
      }
    }

    // بدء التهيئة
    initAuth();
  </script>
</body>
</html>
